<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar senha — 100 Criptografia</title>
<link rel="stylesheet" href="CSS/tyle.css">
</head>
<body>
  <div class="pagina central">
    <div style="position: relative;">
      <a class="voltar" href="login.html" aria-label="Voltar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>

      <div class="principal">
        <div class="cabecalho">
          <div class="marca">
            <span class="glifo">100</span>
          </div>
          <span class="titulo">Recuperar senha</span>
        </div>

        <form id="formulario-recuperar-senha" novalidate>
          <p class="aviso-formulario" id="recuperar-aviso"></p>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="recuperar-senha" placeholder="Nova senha" autocomplete="new-password">
            </div>
          </div>

          <ul class="regras" id="recuperar-regras"></ul>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="recuperar-confirmar-senha" placeholder="Confirmar nova senha" autocomplete="new-password">
            </div>
            <p class="campo-mensagem" id="recuperar-confirmar-senha-msg"></p>
          </div>

          <button type="submit" class="botao botao-claro botao-bloco">Alterar senha</button>
        </form>

        <p class="rodape">Lembra da senha? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
