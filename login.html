<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — 100 Criptografia</title>
<link rel="stylesheet" href="CSS/tyle.css">
</head>
<body>
  <div class="pagina central">
    <div style="position: relative;">
      <a class="voltar" href="index.html" aria-label="Voltar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>

      <div class="principal">
        <div class="cabecalho">
          <div class="marca">
           <span class="glifo">100</span>
          </div>
          <span class="titulo">Entrar</span>
        </div>

        <form id="formulario-login" novalidate>
          <p class="aviso-formulario" id="login-aviso"></p>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
              <input type="email" id="login-email" placeholder="E-mail" autocomplete="email">
            </div>
            <p class="campo-mensagem" id="login-email-msg"></p>
          </div>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
            </div>
            <p class="campo-mensagem" id="login-senha-msg"></p>
          </div>

          <div class="linha-formulario">
            <a class="link-discreto" href="esqueci-senha.html">Esqueci minha senha</a>
            <label class="caixa-selecao">
              <input type="checkbox" id="login-lembrar">
              Lembrar-me
            </label>
          </div>

          <button type="submit" class="botao botao-claro botao-bloco">Entrar</button>
        </form>

        <p class="cartao-rodape">Ainda não tem uma conta? <a href="cadastro.html">Cadastrar</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
