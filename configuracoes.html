<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações — 100 Criptografia</title>
<link rel="stylesheet" href="CSS/configuracoes.css">
</head>
<body>
  <div class="pagina central">
    <div style="position: relative; width: 100%; max-width: 420px;">
      <a class="voltar" href="projeto.html" >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </a>

      <div class="principal principal-config">
        <div class="cabecalho">
          <div class="marca">
            <span class="glifo">100</span>
          </div>
          <span class="titulo">Configurações</span>
        </div>

        <p class="rotulo-secao">Dados / Informações</p>

        <form id="formulario-config" novalidate>
          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="config-nome" placeholder="Nome" autocomplete="name">
            </div>
          </div>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
              <input type="email" id="config-email" placeholder="E-mail" autocomplete="email">
            </div>
          </div>

          <div class="campo">
            <div class="campo-entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="config-senha" placeholder="Senha" autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="botao botao-claro botao-bloco">Atualizar dados</button>
        </form>

        <div class="secao-perigo">
          <button type="button" class="botao botao-perigo" id="botao-deletar-conta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0Z"/></svg>
            Deletar conta
          </button>
        </div>

        <!-- confirmação de senha exigida para qualquer alteração -->
        <div class="sobreposicao" id="sobreposicao-senha">
          <div class="modal">
            <p class="modal-texto">É necessário a senha para fazer qualquer alteração de informações.</p>
            <div class="campo">
              <div class="campo-entrada">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="confirmar-senha-atual" placeholder="Senha">
              </div>
            </div>
            <p class="rodape" style="margin: -6px 0 16px;"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
            <button type="button" class="botao botao-claro botao-bloco" id="botao-confirmar-senha">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
